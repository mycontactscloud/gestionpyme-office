INCLUDE:CPLinux-LOKit

--with-gnu-patch=/usr/local/bin/gpatch
--with-external-dict-dir=/usr/local/share/hunspell
--with-external-hyph-dir=/usr/local/share/hyphen
--with-external-thes-dir=/usr/local/share/mythes
# fonts come from ports packages, listed as run-time dependencies of the port
--without-fonts
--without-myspell-dicts
--disable-noto-font

# internal build fails on FreeBSD 15.1
# icu: genrb/genbrk cannot find data at runtime
--with-system-icu
--enable-python=system
--with-system-redland
# cairo: internal meson can't find pixman/fontconfig
--with-system-cairo
--with-system-fontconfig
--with-system-freetype

# no deb/rpm packaging
--disable-epm
--without-package-format
