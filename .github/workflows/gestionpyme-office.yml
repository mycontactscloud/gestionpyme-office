name: Collect Ubuntu source for GestionPYME Office
run-name: Ubuntu source gp-26.04.6.1-5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download and verify the compiled image
        run: |
          RELEASE=gp-26.04.6.1-5
          BASE="https://github.com/mycontactscloud/gestionpyme-office/releases/download/$RELEASE"
          curl --fail --location --retry 3 --output "gestionpyme-office-$RELEASE.tar.zst" "$BASE/gestionpyme-office-$RELEASE.tar.zst"
          curl --fail --location --retry 3 --output SHA256SUMS "$BASE/SHA256SUMS"
          curl --fail --location --retry 3 --output build-manifest.json "$BASE/build-manifest.json"
          sha256sum --check --ignore-missing SHA256SUMS
          docker image load --input "gestionpyme-office-$RELEASE.tar.zst"
          python3 - <<'PY'
          import json,subprocess
          m=json.load(open('build-manifest.json'))
          assert m['release']=='gp-26.04.6.1-5' and m['sourceCommit']=='f51d404368ce565e91ef76eb12901b7e380b5b2c'
          i=json.loads(subprocess.check_output(['docker','image','inspect','mycontactscloud/gestionpyme-office:gp-26.04.6.1-5']))[0]
          assert i['Id']==m['imageId'] and i['Config']['Labels']['org.opencontainers.image.revision']==m['sourceCommit']
          PY
      - name: Collect exact Ubuntu source packages
        run: |
          IMAGE_ID=$(python3 -c 'import json; print(json.load(open("build-manifest.json"))["imageId"])')
          DEST=/root/collabora-maintenance/gp-26.04.6.1-5
          sudo python3 -B mcc-distribution/collect-ubuntu-source.py --image-id "$IMAGE_ID" --release gp-26.04.6.1-5 --output "$DEST"
          sudo install -m 0644 "$DEST/gestionpyme-office-gp-26.04.6.1-5-ubuntu-source.tar" .
          sudo install -m 0644 "$DEST/UBUNTU-SHA256SUMS" .
          sudo install -m 0644 "$DEST/ubuntu-source/packages.tsv" ubuntu-packages.tsv
          sha256sum --check UBUNTU-SHA256SUMS
          python3 - <<'PY'
          import json
          m=json.load(open('build-manifest.json'))
          m['ubuntuSourceArchive']='gestionpyme-office-gp-26.04.6.1-5-ubuntu-source.tar'
          m['ubuntuSourceSha256']=open('UBUNTU-SHA256SUMS').read().split()[0]
          open('ubuntu-source-manifest.json','w').write(json.dumps(m,ensure_ascii=False,indent=2))
          PY
      - name: Publish corresponding Ubuntu source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload gp-26.04.6.1-5 gestionpyme-office-gp-26.04.6.1-5-ubuntu-source.tar UBUNTU-SHA256SUMS ubuntu-packages.tsv ubuntu-source-manifest.json
